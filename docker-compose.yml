services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: django_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/env
    environment:
      - PYTHONUNBUFFERED=1
    command: python manage.py runserver 0.0.0.0:8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nextjs_frontend
    restart: always
    ports:
      - "0.0.0.0:3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - next_cache:/app/.next
    env_file:
      - ./frontend/.env.local
    environment:
      - NODE_ENV=production # Fixed: Production environment
    depends_on:
      - backend
    command: sh -c "npm run build && npm run start" # Fixed: Builds before starting production server

volumes:
  frontend_node_modules:
  next_cache:
